<!doctype html>
<html>
	<head>
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
		<script>

			$(document).ready(function(){
        
        function isSubstring(big, small) {
          if (big.indexOf(small) >= 0) {
            return true;
          } else {
            return false;
          }
        }

        function isRotation(s1, s2) {

          if (s1.length !== s2.length) {
            return false;
          }

          let s1s1 = s1 + s1;

          return isSubstring(s1s1, s2);
        }

        let output = "<h2>>> CTCI Chapter 1.9 – String Rotation</h2>";

        output += "<b>Test 1:</b> " + isRotation("waterbottle", "erbottlewat") + "<br>";
        output += "<b>Test 2:</b> " + isRotation("hello", "llohe") + "<br>";
        output += "<b>Test 3:</b> " + isRotation("hello", "lloeh") + "<br>";
        output += "<b>Test 4:</b> " + isRotation("abc", "cab") + "<br>";
        output += "<b>Test 5:</b> " + isRotation("abc", "acb");

        $('#t1').html(output);
			});

		</script>
	</head>
	
	<body>
		<div>
			<p id='t1'></p>
		</div>
	</body>

</html>
