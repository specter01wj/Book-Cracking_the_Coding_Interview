<!doctype html>
<html>
	<head>
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
		<script>

			$(document).ready(function(){
        
        // =========================================
        // Solution 1 (BAD): string concatenation
        // =========================================
        function compressBad(str) {
          let compressed = "";
          let count = 0;

          for (let i = 0; i < str.length; i++) {
            count++;
            if (i + 1 >= str.length || str[i] !== str[i + 1]) {
              compressed += str[i] + count;
              count = 0;
            }
          }
          return compressed.length < str.length ? compressed : str;
        }

        // =========================================
        // Solution 2: array builder
        // =========================================
        function compress(str) {
          let result = [];
          let count = 0;

          for (let i = 0; i < str.length; i++) {
            count++;
            if (i + 1 >= str.length || str[i] !== str[i + 1]) {
              result.push(str[i] + count);
              count = 0;
            }
          }
          const compressed = result.join('');
          return compressed.length < str.length ? compressed : str;
        }

        // =========================================
        // Solution 3: optimized
        // =========================================
        function compressOptimized(str) {
          let finalLength = 0;
          let count = 0;

          for (let i = 0; i < str.length; i++) {
            count++;
            if (i + 1 >= str.length || str[i] !== str[i + 1]) {
              finalLength += 1 + count.toString().length;
              count = 0;
            }
          }
          if (finalLength >= str.length) return str;
          return compress(str);
        }

        const tests = ["aabcccccaaa", "abcdef"];

        let output = "<h2>>> CTCI Chapter 1.6 – String Compression</h2>";

        output += "<h3>Solution 1 (Bad)</h3>";
        tests.forEach(s => output += `${s} → ${compressBad(s)}<br>`);

        output += "<h3>Solution 2</h3>";
        tests.forEach(s => output += `${s} → ${compress(s)}<br>`);

        output += "<h3>Solution 3</h3>";
        tests.forEach(s => output += `${s} → ${compressOptimized(s)}<br>`);

        $('#t1').html(output);
			});

		</script>
	</head>
	
	<body>
		<div>
			<p id='t1'></p>
		</div>
	</body>

</html>
