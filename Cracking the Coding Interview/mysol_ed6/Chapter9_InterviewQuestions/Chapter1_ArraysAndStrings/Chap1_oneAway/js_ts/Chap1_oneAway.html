<!doctype html>
<html>
	<head>
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
		<script>

			$(document).ready(function(){
        
        // =========================================
        // Solution 1: Separated logic
        // =========================================
        function oneEditAwaySeparated(first, second) {
          if (first.length === second.length) {
            return oneEditReplace(first, second);
          } else if (first.length + 1 === second.length) {
            return oneEditInsert(first, second);
          } else if (first.length - 1 === second.length) {
            return oneEditInsert(second, first);
          }
          return false;
        }

        function oneEditReplace(s1, s2) {
          let foundDiff = false;
          for (let i = 0; i < s1.length; i++) {
            if (s1[i] !== s2[i]) {
              if (foundDiff) return false;
              foundDiff = true;
            }
          }
          return true;
        }

        function oneEditInsert(s1, s2) {
          let i = 0, j = 0;
          while (i < s1.length && j < s2.length) {
            if (s1[i] !== s2[j]) {
              if (i !== j) return false;
              j++;
            } else {
              i++; j++;
            }
          }
          return true;
        }

        // =========================================
        // Solution 2: Merged logic (preferred)
        // =========================================
        function oneEditAway(first, second) {
          if (Math.abs(first.length - second.length) > 1) return false;

          const shorter = first.length < second.length ? first : second;
          const longer  = first.length < second.length ? second : first;

          let i = 0, j = 0;
          let foundDiff = false;

          while (i < shorter.length && j < longer.length) {
            if (shorter[i] !== longer[j]) {
              if (foundDiff) return false;
              foundDiff = true;
              if (shorter.length === longer.length) i++;
            } else {
              i++;
            }
            j++;
          }
          return true;
        }

        // =========================================
        // Tests
        // =========================================
        const tests = [
          ["pale", "ple"],
          ["pales", "pale"],
          ["pale", "bale"],
          ["pale", "bake"]
        ];

        let output = "<h2>>> CTCI Chapter 1.5 – One Away</h2>";

        output += "<h3>Solution 1: oneEditAwaySeparated</h3>";
        tests.forEach(t => {
          output += `"${t[0]}" vs "${t[1]}" → ${oneEditAwaySeparated(t[0], t[1])}<br>`;
        });

        output += "<h3>Solution 2: oneEditAway (merged)</h3>";
        tests.forEach(t => {
          output += `"${t[0]}" vs "${t[1]}" → ${oneEditAway(t[0], t[1])}<br>`;
        });

        $('#t1').html(output);
			});

		</script>
	</head>
	
	<body>
		<div>
			<p id='t1'></p>
		</div>
	</body>

</html>
